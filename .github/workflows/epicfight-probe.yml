name: Epic Fight probe

# Разовая разведка: печатает, какие поля JSON читает загрузчик патчей мобов Epic Fight
# и какие ресурсы анимаций в нём есть. Нужна, чтобы datapack-патч совпадал с установленной версией.
on:
  push:
    paths: ['.github/workflows/epicfight-probe.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch Epic Fight
        run: python3 tools/fetch_mods.py /tmp/ef /tmp/ef-client "$GITHUB_STEP_SUMMARY" required:epic-fight
      - name: Dump the mob patch loader
        run: |
          jar=$(ls /tmp/ef/*.jar | grep -i epic | head -1); echo "JAR $jar"
          mkdir -p /tmp/x && cd /tmp/x && unzip -q -o "$jar"
          echo "==== reloader classes ===="
          ls yesman/epicfight/api/data/reloader/ | grep -i mobpatch
          for c in $(ls yesman/epicfight/api/data/reloader/ | grep -i 'MobPatchReloadListener' | sed 's/.class$//'); do
            echo "==== JAVAP $c ===="
            javap -c -p -cp "$jar" "yesman.epicfight.api.data.reloader.$c" | grep -E "ldc|Method .*(get|has|deserialize|parse)|invokestatic|getstatic .*Animations|^  [a-z].*\(" | grep -vE "LineNumber|java/lang/StringBuilder" | sed 's/^ *//' | cut -c1-200
          done
          echo "==== condition classes ===="
          find yesman/epicfight/data/conditions -name '*.class' | sort | tr '\n' ' '
          echo
          for f in $(find yesman/epicfight/data/conditions -maxdepth 1 -name '*Conditions*.class' -o -maxdepth 1 -name '*Registry*.class' | head -5); do echo "-- $f"; javap -c -p -cp "$jar" "$(echo ${f%.class} | tr / .)" | grep -E "ldc" | sed 's/^ *//' | cut -c1-160; done
          echo "==== entity conditions ===="
          for f in $(find yesman/epicfight/data/conditions/entity -name '*.class' | head -30); do echo "-- $f"; strings -n 3 "$f" | grep -E '^[a-z_]+$' | sort -u | tr '\n' ' '; echo; done
