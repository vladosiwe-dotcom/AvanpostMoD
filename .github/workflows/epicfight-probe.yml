name: Epic Fight probe

# Разовая разведка: печатает, какие поля JSON читает загрузчик патчей мобов Epic Fight
# и какие ресурсы анимаций в нём есть. Нужна, чтобы datapack-патч совпадал с установленной версией.
on:
  push:
    paths: ['.github/workflows/epicfight-probe.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch Epic Fight
        run: python3 tools/fetch_mods.py /tmp/ef /tmp/ef-client "$GITHUB_STEP_SUMMARY" required:epic-fight
      - name: Dump the mob patch loader
        run: |
          jar=$(ls /tmp/ef/*.jar | grep -i epic | head -1); echo "JAR $jar"
          mkdir -p /tmp/x && cd /tmp/x && unzip -q -o "$jar"
          echo "==== classes mentioning mobpatch ===="
          grep -rl --include=*.class -i "mobpatch" . | head -40
          for f in $(grep -rl --include=*.class -i "mobpatch" . | head -12); do
            echo "==== STRINGS $f ===="
            strings -n 3 "$f" | grep -E '^[a-z_A-Z0-9:/.]+$' | sort -u | tr '\n' ' ' | fold -w 400
            echo
          done
          echo "==== data/*/epicfight_mobpatch in jar ===="
          find . -path '*epicfight_mobpatch*' | head -20
          for f in $(find . -path '*epicfight_mobpatch*' -name '*.json' | head -3); do echo "== $f"; cat "$f"; echo; done
          echo "==== animation resources (biped combat/living) ===="
          find . -path '*animmodels/animations/biped*' -name '*.json' | sed 's#.*/animations/##' | sort | tr '\n' ' ' | fold -w 400
          echo
          echo "==== weapon categories ===="
          javap -cp "$jar" yesman.epicfight.world.capabilities.item.CapabilityItem\$WeaponCategories 2>/dev/null | head -40
          javap -cp "$jar" yesman.epicfight.world.capabilities.item.CapabilityItem\$Styles 2>/dev/null | head -20
          echo "==== predicates ===="
          for c in $(unzip -l "$jar" | awk '{print $4}' | grep -i 'BehaviorPredicate\|CombatBehaviors' | grep class | head -20); do echo "-- $c"; strings -n 3 "$c" | grep -E '^[a-z_]+$' | sort -u | tr '\n' ' '; echo; done
