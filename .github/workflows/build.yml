name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the mod
        run: ./gradlew build --no-daemon --stacktrace
      - name: Game tests on a dedicated server
        # The game test server can exit with code 0 even when it fails to start, so the log decides.
        run: |
          set -o pipefail
          mkdir -p run && echo "eula=true" > run/eula.txt
          timeout 900 ./gradlew runGameTestServer --no-daemon --stacktrace 2>&1 | tee gametest.log
          if grep -q "Failed to start the minecraft server" gametest.log; then echo "::error::server failed to start"; exit 1; fi
          grep -Eq "All [0-9]+ required tests passed" gametest.log || { echo "::error::required game tests did not pass"; exit 1; }
      # Второй прогон с Iron's Spells 'n Spellbooks и Solo Status System: проверяет мягкие интеграции.
      - name: Game tests with Iron's Spells installed
        run: |
          set -o pipefail
          python3 tools/fetch_mods.py run/mods /tmp/client-mods "$GITHUB_STEP_SUMMARY" required:irons-spells-n-spellbooks+irons-lib+curios+geckolib+playeranimator
          timeout 900 ./gradlew runGameTestServer --no-daemon --stacktrace 2>&1 | tee gametest-irons.log
          grep -E "Iron's Spells|LordsOutpost" gametest-irons.log | head -20 || true
          grep -Eq "All [0-9]+ required tests passed" gametest-irons.log || { echo "::error::game tests with Iron's Spells did not pass"; grep -E "failed at|   - " gametest-irons.log | head; exit 1; }
      - name: What the tests reported
        if: always()
        run: |
          grep -E "LordsOutpost|failed at|tests passed|tests failed|   - " gametest.log | grep -v "^\s*at " | head -60 || true
          echo "---- first errors ----"
          grep -nE "ERROR|Exception|Caused by" gametest.log | grep -v "^[0-9]*:\s*at " | head -25 || true
      - name: Upload the mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lordsoutpost-jar
          path: build/libs/*.jar
          if-no-files-found: error
